<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市供水管网漏损监测系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <h1 class="title">💧 城市供水管网漏损监测系统</h1>
                <div class="status-indicator">
                    <span class="status-dot" id="connectionStatus"></span>
                    <span id="connectionText">连接中...</span>
                </div>
            </div>
            <div class="header-right">
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">节点总数</span>
                        <span class="stat-value" id="totalNodes">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">在线传感器</span>
                        <span class="stat-value" id="onlineSensors">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">告警数量</span>
                        <span class="stat-value warning" id="alarmCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">漏损可疑</span>
                        <span class="stat-value danger" id="leakSuspectCount">0</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar left-sidebar">
                <div class="panel">
                    <h3 class="panel-title">📍 图例</h3>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-dot plant"></div>
                            <span>水厂</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot pump"></div>
                            <span>泵站</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot pressure-station"></div>
                            <span>调压站</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot junction"></div>
                            <span>普通节点</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot valve"></div>
                            <span>阀门</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot hydrant"></div>
                            <span>消火栓</span>
                        </div>
                    </div>
                    <h3 class="panel-title" style="margin-top: 20px;">🎨 压力状态</h3>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-dot" style="background: #22c55e;"></div>
                            <span>正常 (0.25-0.45 MPa)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background: #eab308;"></div>
                            <span>异常 (0.15-0.25 或 0.45-0.55)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background: #ef4444;"></div>
                            <span>危险 (&lt;0.15 或 &gt;0.55)</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">🚨 实时告警</h3>
                    <div class="alarm-list" id="alarmList">
                        <div class="empty-state">暂无告警</div>
                    </div>
                </div>
            </aside>

            <main class="content">
                <div class="canvas-container">
                    <canvas id="networkCanvas"></canvas>
                    <div class="canvas-controls">
                        <button class="control-btn" id="zoomIn" title="放大">+</button>
                        <button class="control-btn" id="zoomOut" title="缩小">-</button>
                        <button class="control-btn" id="resetView" title="重置">⟲</button>
                    </div>
                </div>
            </main>

            <aside class="sidebar right-sidebar">
                <div class="panel" id="nodeDetailPanel" style="display: none;">
                    <div class="panel-header">
                        <h3 class="panel-title">📊 节点详情</h3>
                        <button class="close-btn" id="closeNodeDetail">×</button>
                    </div>
                    <div id="nodeDetailContent"></div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">🔍 漏损可疑区域</h3>
                    <div class="leak-list" id="leakList">
                        <div class="empty-state">暂无分析数据</div>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">📈 系统概览</h3>
                    <div class="overview-stats">
                        <div class="overview-item">
                            <span class="overview-label">管道总长</span>
                            <span class="overview-value">800 km</span>
                        </div>
                        <div class="overview-item">
                            <span class="overview-label">压力传感器</span>
                            <span class="overview-value">300 个</span>
                        </div>
                        <div class="overview-item">
                            <span class="overview-label">流量计</span>
                            <span class="overview-value">200 个</span>
                        </div>
                        <div class="overview-item">
                            <span class="overview-label">上报间隔</span>
                            <span class="overview-value">5 分钟</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="js/core/EventBus.js"></script>
    <script src="js/services/WebSocketClient.js"></script>
    <script src="js/stores/DataStore.js"></script>
    <script src="js/managers/AlarmManager.js"></script>
    <script src="js/managers/LeakManager.js"></script>
    <script src="js/network.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
