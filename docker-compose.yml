version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: water-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: water_monitor
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/init-timescale.sql:/docker-entrypoint-initdb.d/02-timescale.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d water_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - water-monitor-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water-monitor-app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      USE_DB: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: water_monitor
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      HTTP_PORT: 3000
      SIMULATE_DATA: ${SIMULATE_DATA:-true}
      SIMULATOR_CONFIG: ${SIMULATOR_CONFIG:-simulator-config.json}
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - water-monitor-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: water-monitor-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@water-monitor.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - water-monitor-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    profiles:
      - debug

volumes:
  pgdata:
    driver: local
  pgadmin-data:
    driver: local

networks:
  water-monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
